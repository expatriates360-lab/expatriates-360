<svg width="320" height="400" viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6FBFB"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#0B7C7C"/>
    </linearGradient>
  </defs>

  <!-- Icon mark, centered top -->
  <g transform="translate(60,20)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bgGrad)"/>
    <rect x="46" y="38" width="28" height="124" rx="10" fill="url(#markGrad)"/>
    <rect x="126" y="38" width="28" height="124" rx="10" fill="url(#markGrad)"/>
    <rect x="45" y="90" width="118" height="22" rx="10" fill="url(#markGrad)" transform="rotate(-32 100 100)"/>
  </g>

  <!-- Wordmark, centered below -->
  <text x="160" y="330" font-family="Liberation Sans, Arial, sans-serif" font-weight="700"
        font-size="64" letter-spacing="1" fill="url(#textGrad)" text-anchor="middle">Hunared</text>
</svg>
